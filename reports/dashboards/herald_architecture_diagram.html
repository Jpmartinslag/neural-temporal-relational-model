<!DOCTYPE html>
<html lang="fr">
<head>

<title>HERALD — Architecture</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #0d1117;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  padding: 24px;
}
.wrap { width: 100%; max-width: 1000px; }
svg { width: 100%; height: auto; display: block; }
.controls {

  justify-content: center;
  gap: 10px;
  margin-top: 14px;
}
button {
  background: #141830;
  border: 1px solid #2a3050;
  color: #9aa4bf;
  padding: 7px 22px;
  border-radius: 6px;
  cursor: pointer;
  font: 12px/1 inherit;
  transition: border-color .2s, color .2s;
}
button:hover { border-color: #4aa3ff; color: #4aa3ff; }
</style>
</head>

  <!-- zones -->

  <text x="804" y="103" text-anchor="middle" fill="#26a69a"

        font-size="8" font-weight="700" letter-spacing=".8">WMAPE MOYEN</text>
  <text x="804" y="254" text-anchor="middle" fill="#26a69a"

  <!-- sectors -->

  <text x="804" y="297" text-anchor="middle" fill="#26a69a"
        font-size="8.5" font-weight="700">SECTORIEL A10</text>
  <text x="804" y="332" text-anchor="middle" fill="#eef2ff"

  <text x="804" y="354" text-anchor="middle" fill="#9aa4bf" font-size="8">9 secteurs économiques</text>
  <text x="804" y="370" text-anchor="middle" fill="#9aa4bf" font-size="8">Industrie · Construction</text>

<!-- ══ ARROWS ══ -->

<!-- SIDE → Ridge AR -->
<path id="a1" d="M176,114 L212,102"
      stroke="#4aa3ff" stroke-width="1.6" fill="none" opacity="0"
      marker-end="url(#m-blue)"/>

<!-- SIDE → STGNN (curved down) -->
<path id="a2" d="M176,160 Q192,255 212,268"
      stroke="#4aa3ff" stroke-width="1.6" fill="none" opacity="0"
      marker-end="url(#m-blue)"/>

<!-- URSSAF → STGNN -->

      stroke="#b084f5" stroke-width="1.6" fill="none" opacity="0"

      stroke="#b084f5" stroke-width="1.6" fill="none" opacity="0"

<!-- STGNN → Combiner -->
<path id="a5" d="M580,278 L618,278"
      stroke="#f7834f" stroke-width="1.6" fill="none" opacity="0"

<path id="a6" d="M394,102 Q560,20 622,254"

      marker-end="url(#m-green)"/>

<!-- Combiner → Output -->
<path id="a7" d="M678,278 L712,278"
      stroke="#9aa4bf" stroke-width="1.9" fill="none" opacity="0"

</svg>

<div class="controls">
  <button id="btn-replay">↻  Replay</button>
</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
gsap.defaults({ ease: 'power2.out' });

// Animate stroke-dashoffset for "draw" effect
function drawPath(id, dur) {
  const el = document.getElementById(id);
  const len = el.getTotalLength();
  gsap.set(el, { strokeDasharray: len, strokeDashoffset: len, opacity: 1 });
  return gsap.to(el, { strokeDashoffset: 0, duration: dur });
}

function buildTL() {
  // Reset all
  gsap.set(['#g-herald','#g-herald-lbl','#g-side','#g-urssaf',
            '#g-ridge','#g-stgnn','#g-gate','#g-comb','#g-output',
            '#a1','#a2','#a3','#a4','#a5','#a6','#a7'], { opacity: 0 });
  gsap.set('#g-side',   { x: -18 });
  gsap.set('#g-urssaf', { x: -18 });
  gsap.set(['#g-ridge','#g-stgnn','#g-gate'], { y: 14 });
  gsap.set('#g-comb',   { scale: 0.6, transformOrigin: '648px 278px' });
  gsap.set('#g-output', { x: 18 });

  const tl = gsap.timeline();

  // 1 — HERALD frame
  tl.to('#g-herald',     { opacity: 1, duration: 0.5 })
    .to('#g-herald-lbl', { opacity: 1, duration: 0.3 }, '-=0.2')

  // 2 — Inputs slide in from left
    .to('#g-side',   { opacity: 1, x: 0, duration: 0.4 }, '+=0.05')
    .to('#g-urssaf', { opacity: 1, x: 0, duration: 0.4 }, '-=0.2')

  // 3 — Ridge block
    .to('#g-ridge', { opacity: 1, y: 0, duration: 0.4 }, '+=0.05')

  // 4 — Arrow: SIDE → Ridge
    .add(() => drawPath('a1', 0.3))

  // 5 — STGNN block
    .to('#g-stgnn', { opacity: 1, y: 0, duration: 0.4 }, '+=0.05')

  // 6 — Arrows: SIDE → STGNN + URSSAF → STGNN
    .add(() => drawPath('a2', 0.45))
    .add(() => drawPath('a3', 0.3), '-=0.3')

  // 7 — HC5 Gate
    .to('#g-gate', { opacity: 1, y: 0, duration: 0.4 }, '+=0.05')

  // 8 — Arrow: Gate → STGNN
    .add(() => drawPath('a4', 0.28))

  // 9 — Combiner pops in
    .to('#g-comb', { opacity: 1, scale: 1, duration: 0.35, ease: 'back.out(1.6)' }, '+=0.1')

  // 10 — Ridge arc to Combiner (fade: dashed style preserved)
    .to('#a6', { opacity: 1, duration: 0.55 })

  // 11 — STGNN → Combiner
    .add(() => drawPath('a5', 0.35), '-=0.35')

  // 12 — Output slides in from right
    .to('#g-output', { opacity: 1, x: 0, duration: 0.45 }, '+=0.08')

  // 13 — Final arrow
    .add(() => drawPath('a7', 0.3), '-=0.2')

  // 14 — Subtle pulse on WMAPE value
    .to('#wmape-num', {
      fill: '#5dd4c8', duration: 0.3, yoyo: true, repeat: 1, ease: 'sine.inOut'
    }, '+=0.1')

  return tl;
}

let tl = buildTL();

document.getElementById('btn-replay').addEventListener('click', () => {
  tl.kill();
  tl = buildTL();
});
</script>
</body>
</html>
